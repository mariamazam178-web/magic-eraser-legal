<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Magic Eraser — Legal</title>
  <meta name="description" content="Magic Eraser — AI photo editing. Privacy Policy and Terms of Service." />
  <link rel="icon" href="assets/favicon.png" />
  <style>
    :root {
      --bg: #0D0E1C;
      --surface: #181A2E;
      --surface-elevated: #232640;
      --text: #F4F5FB;
      --text-secondary: #A9ADC6;
      --text-muted: #717692;
      --primary: #7C5CFC;
      --secondary: #22C7EE;
      --border: #262941;
      --gradient: linear-gradient(135deg, #7C5CFC 0%, #22C7EE 100%);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      text-align: center;
      padding: 24px;
      position: relative;
      overflow: hidden;
    }

    /* Ambient glow */
    body::before,
    body::after {
      content: '';
      position: absolute;
      border-radius: 50%;
      filter: blur(120px);
      opacity: 0.25;
      pointer-events: none;
    }

    body::before {
      width: 480px;
      height: 480px;
      background: var(--primary);
      top: -160px;
      left: -120px;
    }

    body::after {
      width: 420px;
      height: 420px;
      background: var(--secondary);
      bottom: -160px;
      right: -100px;
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 560px;
      width: 100%;
    }

    .logo {
      font-size: 56px;
      line-height: 1;
      margin-bottom: 16px;
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 12px;
    }

    h1 .accent {
      background: var(--gradient);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .tagline {
      font-size: 1.1rem;
      color: var(--text-secondary);
      margin-bottom: 48px;
      line-height: 1.6;
    }

    .buttons {
      display: flex;
      flex-direction: column;
      gap: 16px;
      width: 100%;
      max-width: 380px;
      margin: 0 auto;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 18px 28px;
      border-radius: 16px;
      font-size: 1.05rem;
      font-weight: 600;
      text-decoration: none;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .btn-primary {
      background: var(--gradient);
      color: #fff;
      box-shadow: 0 8px 24px rgba(124, 92, 252, 0.35);
    }

    .btn-secondary {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn:hover {
      transform: translateY(-2px);
    }

    .btn-primary:hover {
      box-shadow: 0 12px 32px rgba(124, 92, 252, 0.5);
    }

    .btn-secondary:hover {
      background: var(--surface-elevated);
    }

    footer {
      position: relative;
      z-index: 1;
      margin-top: 64px;
      color: var(--text-muted);
      font-size: 0.875rem;
    }

    @media (max-width: 480px) {
      h1 { font-size: 2rem; }
      .logo { font-size: 44px; }
    }
  </style>
</head>
<body>
  <main class="container">
    <div class="logo">✨</div>
    <h1><span class="accent">Magic Eraser</span></h1>
    <p class="tagline">AI-powered photo editing. Remove backgrounds, erase objects, and enhance your images in seconds.</p>
    <div class="buttons">
      <a class="btn btn-primary" href="privacy-policy.html">🔒 Privacy Policy</a>
      <a class="btn btn-secondary" href="terms-of-service.html">📄 Terms of Service</a>
    </div>
  </main>
  <footer>&copy; Ideatech. All rights reserved.</footer>
</body>
</html>
